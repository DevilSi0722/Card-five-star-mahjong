name: Build and Multiplayer
on:
  push:
    branches: [feature/server-realtime-multiplayer]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_BUILD_CPUS: "2"
      - run: npm run check:realtime -- --self-test
